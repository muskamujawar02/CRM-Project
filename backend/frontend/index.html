<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support CRM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
       <h1>CRM Dashboard</h1>
       <button id="darkModeBtn">🌙 Dark Mode</button>
    </div>
    <div class="card">

            <h2>Create Ticket</h2>

            <input type="text" id="customer_name" placeholder="Customer Name">

            <input type="email" id="customer_email" placeholder="Customer Email">

            <input type="text" id="subject" placeholder="Subject">

            <textarea id="description" placeholder="Description"></textarea>

            <button onclick="createTicket()">Create Ticket</button>

        </div>

        <div class="card">

            <h2>Search & Filter</h2>

            <input type="text" id="search" placeholder="Search tickets">

            <select id="statusFilter">
                <option value="">All</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Closed">Closed</option>
            </select>

            <button onclick="loadTickets()">Apply</button>

        </div>

        <div class="card">

            <h2>All Tickets</h2>

            <table>

                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="ticketTable"></tbody>

            </table>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
